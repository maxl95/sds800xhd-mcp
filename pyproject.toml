[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "sds800xhd-mcp"
version = "1.0.0"
description = "HTTP MCP server for Siglent SDS800X HD oscilloscopes (SCPI over VISA socket) with web UI"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "The sds800xhd-mcp contributors" }]
dependencies = [
    "mcp>=2.3,<3",
    "pyvisa>=1.14",
    "pyvisa-py>=0.7",
    "uvicorn>=0.30",
]

[project.optional-dependencies]
dev = ["pytest>=8"]

[project.scripts]
sds800xhd-mcp = "sds800xhd_mcp.server:main"

[tool.setuptools]
packages = ["sds800xhd_mcp"]

[tool.setuptools.package-data]
sds800xhd_mcp = ["static/*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
